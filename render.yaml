# Blueprint de Deploy Unificado no Render (Frontend + Backend + PostgreSQL)
# goulart318/calc_impostos

databases:
  - name: calc-impostos-db
    databaseName: ret_impostos
    user: ret_impostos_user
    # Plano pago (upgrade feito no painel em 13/11/2026, o gratuito expirou). Manter igual ao painel para o
    # auto-sync do Blueprint não tentar voltar ao plano free. Remover este banco após migrar para o Supabase.
    plan: 0.1c-256mb
    region: ohio

services:
  # -------------------------------------------------------------
  # 1. API BACKEND (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: calc-impostos-backend
    env: node
    plan: free
    region: ohio
    rootDir: calc_impostos/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: calc-impostos-db
          property: connectionString

  # -------------------------------------------------------------
  # 2. FRONTEND (Vite / React SPA)
  # -------------------------------------------------------------
  - type: web
    name: calc-impostos-frontend
    runtime: static
    rootDir: calc_impostos/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: calc-impostos-backend
          property: host
