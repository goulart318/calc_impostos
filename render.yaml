# Blueprint de Deploy no Render (Frontend + Backend) — banco no Supabase (schema calc)
# goulart318/calc_impostos

# O banco de dados NÃO é mais gerenciado por este Blueprint: o calc_impostos usa o schema "calc" do
# Postgres do Supabase (projeto do RAUF), com o usuário restrito "calc_app". O banco antigo do Render
# (calc-impostos-db) deixa de ser declarado aqui e fica "unmanaged" até ser excluído manualmente no painel.

services:
  # -------------------------------------------------------------
  # 1. API BACKEND (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: calc-impostos-backend
    env: node
    plan: free
    region: ohio
    rootDir: calc_impostos/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # String de conexão do Supabase (pooler, modo transaction, usuário calc_app). Definida à mão no painel
      # (sync: false) porque contém senha; nunca versionar o valor.
      #   postgresql://calc_app.<REF_DO_PROJETO>:<SENHA>@aws-0-us-west-2.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

  # -------------------------------------------------------------
  # 2. FRONTEND (Vite / React SPA)
  # -------------------------------------------------------------
  - type: web
    name: calc-impostos-frontend
    runtime: static
    rootDir: calc_impostos/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: calc-impostos-backend
          property: host
